name: Проверка формы АМАПС
on:
  pull_request:
    paths:
      - 'cloudflare-worker-v2.js'
      - 'tests/site-form.test.mjs'
      - '.github/workflows/site-form-tests.yml'
  workflow_dispatch:
jobs:
  form-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare-worker-v2.js
      - run: node --test tests/site-form.test.mjs
